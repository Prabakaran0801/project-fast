app = "mediamover-worker"
primary_region = "iad"

[build]
  dockerfile = "worker/Dockerfile"

[env]
  NODE_ENV = "production"

[processes]
  worker = "node --loader tsx worker/src/index.ts"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Scaling: concurrency controls via BullMQ queue length
# fly scale count 1 --with-volume or use fly autoscale
